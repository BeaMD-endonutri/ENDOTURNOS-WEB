name: Publish EndoTurnos site

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout web repository
        uses: actions/checkout@v4

      - name: Prepare public assets
        run: |
          mkdir -p source/public
          rm -rf source/public/mascots
          cp -R mascots source/public/mascots

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Install and build
        working-directory: source
        run: |
          npm ci
          npm run build

      - name: Replace published site
        run: |
          rm -rf assets index.html
          cp -R source/dist/assets ./assets
          cp source/dist/index.html ./index.html
          touch .nojekyll

      - name: Commit publication
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets index.html .nojekyll
          if git diff --cached --quiet; then
            echo "No publication changes."
          else
            git commit -m "deploy: account linking and staff management"
            git push
          fi
