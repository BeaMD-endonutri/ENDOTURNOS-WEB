name: Publish EndoTurnos site

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout web repository
        uses: actions/checkout@v4
        with:
          path: web
          token: ${{ github.token }}

      - name: Checkout application source
        uses: actions/checkout@v4
        with:
          repository: BeaMD-endonutri/ENDOTURNOS
          ref: main
          path: source

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Install and verify
        working-directory: source
        run: |
          npm ci
          npm test
          npm run build

      - name: Replace published site
        run: |
          rm -rf web/assets web/mascots web/index.html
          cp -R source/dist/. web/
          touch web/.nojekyll

      - name: Commit publication
        working-directory: web
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No publication changes."
          else
            git commit -m "deploy: account linking and staff management"
            git push
          fi
